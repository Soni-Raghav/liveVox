# Quality gate: lint, unit tests and the production PWA build.
# Runs on every push to main and every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build (PWA)
        run: npm run build
